{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:2rem auto;">
  <h2>Set new password</h2>
  <p style="color:var(--muted);font-size:0.9rem;">Enter the unique code from the platform admin, then your new password.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="form-group"><label>Admin code</label><input name="code" required placeholder="6-digit code"/></div>
    <div class="form-group"><label>New password</label><input type="password" name="new_password" required minlength="6"/></div>
    <div class="form-group"><label>Confirm</label><input type="password" name="confirm" required/></div>
    <button class="btn" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
