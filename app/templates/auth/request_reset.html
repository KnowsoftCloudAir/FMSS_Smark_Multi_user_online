{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:2rem auto;">
  <h2>Request password change</h2>
  <p style="color:var(--muted);font-size:0.9rem;">Platform admin must issue a unique code before your new password is accepted.</p>
  {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
  <form method="post"><button class="btn" type="submit">Send request to admin</button></form>
  <p style="margin-top:1rem;"><a href="/account/password-reset">I already have a code</a></p>
</div>
{% endblock %}
