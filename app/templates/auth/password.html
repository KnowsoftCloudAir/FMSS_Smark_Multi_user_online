{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto;">
  <h2>Change password</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="form-group"><label>New password</label><input type="password" name="new_password" required minlength="6" /></div>
    <div class="form-group"><label>Confirm</label><input type="password" name="confirm" required /></div>
    <button class="btn btn-block" type="submit">Save password</button>
  </form>
</div>
{% endblock %}
