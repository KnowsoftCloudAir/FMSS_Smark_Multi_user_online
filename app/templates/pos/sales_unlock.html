{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h2 style="margin-top:0;">Sales Rep code required</h2>
  <p style="color:var(--muted);">Enter your Sales Rep code to open <strong>Scan &amp; Sell</strong>. No valid code = no permission to sell.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/sales/unlock">
    <div class="form-group"><label>Sales Rep code</label>
      <input name="code" required placeholder="e.g. REP001" autocomplete="off" style="text-transform:uppercase;" />
    </div>
    <button class="btn btn-block" type="submit">Unlock Scan &amp; Sell</button>
  </form>
  <p style="font-size:0.8rem;color:var(--muted);margin-top:1rem;">Admin creates codes under Settings (password protected).</p>
</div>
{% endblock %}
