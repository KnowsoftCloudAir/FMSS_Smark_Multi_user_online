<!DOCTYPE html>
<html lang="en" data-theme="{{ biz.theme if biz is defined and biz and biz.theme else 'royal' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Knowsoft Payme{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="icon" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="msapplication-config" content="/static/browserconfig.xml" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div class="brand-bar">
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <button type="button" class="btn btn-ghost btn-sm" onclick="history.back()" title="Back">←</button>
      <a href="{% if user %}/dashboard{% else %}/{% endif %}" style="display:flex;align-items:center;gap:0.45rem;">
        <img src="{{ logo or '/static/logo.png' }}" alt="Payme" class="logo" />
      </a>
    </div>
    <div class="nav nav-scroll">
      {% if user %}
        <a class="btn btn-ghost btn-sm" href="/dashboard">Home</a>
        <a class="btn btn-ghost btn-sm" href="/inventory">Stock</a>
        <a class="btn btn-ghost btn-sm" href="/sales-list">Sales list</a>
        <a class="btn btn-ghost btn-sm" href="/expenses">Expenses</a>
        <a class="btn btn-ghost btn-sm" href="/purchases">Purchases</a>
        <a class="btn btn-ghost btn-sm" href="/reports">Statements</a>
        <a class="btn btn-ghost btn-sm" href="/subscription">Subscription</a>
        <a class="btn btn-ghost btn-sm" href="/settings">Settings</a>
        <a class="btn btn-ghost btn-sm" href="/feedback">Feedback</a>
        <a class="btn btn-ghost btn-sm" href="/account/request-reset">Password</a>
        <a class="btn btn-ghost btn-sm" href="/logout">Logout</a>
      {% else %}
        <a class="btn btn-ghost btn-sm" href="/login">Sign In</a>
        <a class="btn btn-sm" href="/register">Register</a>
      {% endif %}
    </div>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">Payme by Knowsoft</div>
  <script src="/static/js/offline.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
