{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto;">
  <img src="/static/logo.png" style="height:56px;border-radius:10px;display:block;margin:0 auto 1rem;" />
  <h2 style="text-align:center;">Platform admin</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/ks-admin/login">
    <div class="form-group"><label>Username</label><input name="username" value="admin" required autocomplete="username" /></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required autocomplete="current-password" /></div>
    <button class="btn btn-block" type="submit">Sign in</button>
  </form>
  <p style="font-size:0.8rem;color:var(--muted);margin-top:1rem;text-align:center;">
    Default: <code>admin</code> / <code>Knowsoft@Admin1!</code>
  </p>
</div>
{% endblock %}
