{% extends "base.html" %}
{% block content %}
<div class="sidebar-layout">
  {% include "business/_nav.html" %}
  <div>
    <div class="card">
      <h2>Record purchase</h2>
      <form method="post" class="grid-2">
        <div class="form-group"><label>Supplier</label><input name="supplier" /></div>
        <div class="form-group"><label>Amount</label><input type="number" step="0.01" name="amount" required / inputmode="decimal" step="0.01" min="0" required></div>
        <div class="form-group"><label>Payment</label><select name="payment_method"><option value="cash">Cash</option><option value="credit">Credit</option></select></div>
        <div class="form-group"><label>Description</label><input name="description" /></div>
        <button class="btn" type="submit">Save</button>
      </form>
    </div>
    <div class="card" style="margin-top:1rem;">
      <table class="data"><thead><tr><th>Date</th><th>Supplier</th><th>Amount</th><th>Pay</th><th>Note</th></tr></thead>
      <tbody>{% for r in rows %}<tr><td>{{ r.created_at }}</td><td>{{ r.supplier }}</td><td>₦{{ '%.2f'|format(r.total_amount) }}</td><td>{{ r.payment_method }}</td><td>{{ r.description }}</td></tr>{% else %}<tr><td colspan="5">None</td></tr>{% endfor %}</tbody></table>
    </div>
  </div>
</div>
{% endblock %}
