<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vendor Quotation Portal</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #eef2f6; color: #1a1a1a; }
  .banner { background: #1a6b9a; color: #fff; padding: 14px 20px; text-align: center; }
  .banner h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
  .banner p { margin: 4px 0 0; font-size: .85rem; opacity: .9; }
  .wrap { max-width: 820px; margin: 20px auto 40px; background: #fff; border-radius: 12px;
           box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; }
  .inner { padding: 24px 28px 32px; }
  h2 { font-size: 1.05rem; margin: 20px 0 12px; color: #1a6b9a; border-bottom: 2px solid #e8eef5; padding-bottom: 6px; }
  h2:first-child { margin-top: 0; }
  .hint { color: #555; font-size: .9rem; line-height: 1.45; margin-bottom: 12px; }
  .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: .92rem; }
  .msg.ok { background: #e8f5e9; color: #1b5e20; }
  .msg.err { background: #ffebee; color: #b71c1c; }
  .msg.info { background: #e3f2fd; color: #0d47a1; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 600; font-size: .8rem; margin-bottom: 4px; color: #333; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #c5cdd6; border-radius: 8px;
    font-size: .95rem; font-family: inherit; background: #fafbfc;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #1a6b9a44; border-color: #1a6b9a; }
  .full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: .88rem; }
  th, td { border: 1px solid #dde3ea; padding: 8px 10px; text-align: left; }
  th { background: #eef2f6; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; padding: 12px; background: #f8fafc; border-radius: 8px; }
  .check input { width: auto; margin-top: 3px; }
  .check label { font-weight: 500; font-size: .9rem; }
  .btn {
    display: block; width: 100%; padding: 14px; border: 0; border-radius: 8px;
    background: linear-gradient(180deg, #1a8fd0, #1a6b9a); color: #fff;
    font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .file-hint { font-size: .8rem; color: #666; margin-top: 4px; }
</style>
</head>
<body>
  <div class="banner">
    <h1>eProcurement — Vendor Quotation Portal</h1>
    <p id="org-label">Secure vendor submission</p>
  </div>
  <div class="wrap"><div class="inner">
    <div id="status-msg" class="msg info" style="display:none"></div>

    <h2>Request details</h2>
    <p class="hint" id="rfq-meta">Loading…</p>
    <div id="items-box"></div>

    <form id="vendor-form">
      <h2>Vendor registration details</h2>
      <div class="grid">
        <div><label>Vendor name *</label><input name="vendor_name" id="vendor_name" required/></div>
        <div><label>Email</label><input name="vendor_email" id="vendor_email" type="email"/></div>
        <div><label>Phone</label><input name="vendor_phone" id="vendor_phone"/></div>
        <div><label>Address *</label><input name="address" id="address" required/></div>
        <div><label>CAC number *</label><input name="cac_number" id="cac_number" required/></div>
        <div>
          <label>Experience (years / capacity) *</label>
          <select name="experience" id="experience" required>
            <option value="">— Select —</option>
            <option>0–2 years</option><option>3–5 years</option><option>6–10 years</option><option>Over 10 years</option>
            <option>Yes</option><option>No</option>
          </select>
        </div>
        <div>
          <label>Tax clearance *</label>
          <select name="tax_clearance" id="tax_clearance" required>
            <option value="">— Select —</option>
            <option>Yes</option><option>No</option>
          </select>
        </div>
        <div><label>Tax clearance reference</label><input name="tax_ref" id="tax_ref" placeholder="Certificate / ref no."/></div>
        <div><label>Bank name *</label><input name="bank_name" id="bank_name" required/></div>
        <div><label>Bank account number *</label><input name="bank_account" id="bank_account" required/></div>
        <div><label>Account name *</label><input name="bank_account_name" id="bank_account_name" required/></div>
        <div>
          <label>Registered with government *</label>
          <select name="reg_govt" id="reg_govt" required>
            <option value="">— Select —</option>
            <option>Yes</option><option>No</option>
          </select>
        </div>
        <div>
          <label>3 years audit available *</label>
          <select name="audit_3yrs" id="audit_3yrs" required>
            <option value="">— Select —</option>
            <option>Yes</option><option>No</option>
          </select>
        </div>
        <div class="full"><label>Qualification / capacity statement *</label>
          <textarea name="qualification" id="qualification" rows="3" required placeholder="Describe capability to deliver the requested goods/services"></textarea>
        </div>
        <div class="full"><label>Description / notes</label>
          <textarea name="notes" id="notes" rows="2" placeholder="Additional notes on your offer"></textarea>
        </div>
        <div><label>Quotation amount *</label><input name="amount" id="amount" type="number" step="0.01" min="0.01" required/></div>
        <div><label>Validity (days)</label><input name="validity_days" id="validity_days" type="number" value="30" min="1"/></div>
        <div class="full">
          <label>Quotation line items (description, qty, unit cost)</label>
          <table id="quote-lines-table"><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Unit cost</th><th>Amount</th><th></th></tr></thead>
          <tbody id="quote-lines"></tbody></table>
          <button type="button" class="btn" id="btn-add-qline" style="width:auto;padding:8px 14px;margin:8px 0;font-size:.85rem">+ Add line</button>
        </div>
        <div class="full">
          <label>Official letter-head quotation (PDF)</label>
          <input name="file" id="file" type="file" accept=".pdf,application/pdf,image/*"/>
          <p class="file-hint">Upload PDF (or image) of quotation on company letter-head. Max 25MB.</p>
        </div>
      </div>

      <div class="check">
        <input type="checkbox" id="consent" required/>
        <label for="consent">I confirm that our organisation is ready, willing and able to supply the goods/services listed under the stated conditions, and that the information provided is true and complete.</label>
      </div>

      <button type="submit" class="btn" id="submit-btn">Submit quotation</button>
    </form>
  </div></div>

<script>
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var token = parts[parts.length - 1];
  var API = "";

  function showMsg(text, cls) {
    var el = document.getElementById("status-msg");
    el.style.display = "block";
    el.className = "msg " + (cls || "info");
    el.textContent = text;
  }

  async function load() {
    try {
      var r = await fetch(API + "/api/public/quote/" + encodeURIComponent(token));
      var text = await r.text();
      var d;
      try { d = JSON.parse(text); } catch (e) {
        showMsg("Could not load this link. Server response was not valid.", "err");
        document.getElementById("submit-btn").disabled = true;
        return;
      }
      if (!r.ok) {
        showMsg(d.detail || "Invalid link", "err");
        document.getElementById("submit-btn").disabled = true;
        return;
      }
      document.getElementById("org-label").textContent = d.company_label || "Vendor quotation";
      document.getElementById("rfq-meta").innerHTML =
        "<strong>" + (d.rfq_no || "") + "</strong> — " + (d.title || "Request for quotation") +
        (d.deadline ? "<br/>Deadline: " + d.deadline : "") +
        (d.description ? "<br/>" + d.description : "");
      if (d.vendor_name) document.getElementById("vendor_name").value = d.vendor_name;
      if (d.vendor_email) document.getElementById("vendor_email").value = d.vendor_email;

      var box = document.getElementById("items-box");
      if (d.items && d.items.length) {
        var h = "<table><thead><tr><th>Item / service</th><th>Qty</th><th>Unit</th><th>Conditions</th></tr></thead><tbody>";
        d.items.forEach(function (it) {
          h += "<tr><td>" + (it.description || "") + "</td><td>" + (it.quantity || "") +
            "</td><td>" + (it.unit || "") + "</td><td>" + (it.conditions || "") + "</td></tr>";
        });
        box.innerHTML = h + "</tbody></table>";
      } else {
        box.innerHTML = "<p class='hint'>See request description above for scope of supply.</p>";
      }

      if (d.message) showMsg(d.message, d.received || d.already_submitted ? "ok" : (d.valid ? "info" : "err"));
      if (!d.valid) {
        document.getElementById("submit-btn").disabled = true;
        document.getElementById("vendor-form").style.opacity = "0.7";
      }
    } catch (e) {
      showMsg("Network error loading link: " + e.message, "err");
      document.getElementById("submit-btn").disabled = true;
    }
  }

  document.getElementById("vendor-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!document.getElementById("consent").checked) {
      alert("Consent is required before submit.");
      return;
    }
    var fd = new FormData();
    fd.append("vendor_name", document.getElementById("vendor_name").value.trim());
    fd.append("vendor_email", document.getElementById("vendor_email").value.trim());
    fd.append("vendor_phone", document.getElementById("vendor_phone").value.trim());
    fd.append("cac_number", document.getElementById("cac_number").value.trim());
    fd.append("tax_clearance", document.getElementById("tax_clearance").value +
      (document.getElementById("tax_ref").value ? (" / " + document.getElementById("tax_ref").value) : ""));
    fd.append("qualification",
      document.getElementById("qualification").value +
      " | Experience: " + document.getElementById("experience").value +
      " | Reg. Govt: " + document.getElementById("reg_govt").value +
      " | 3yr Audit: " + document.getElementById("audit_3yrs").value +
      " | Address: " + document.getElementById("address").value
    );
    fd.append("bank_name", document.getElementById("bank_name").value.trim());
    fd.append("bank_account", document.getElementById("bank_account").value.trim());
    fd.append("bank_account_name", document.getElementById("bank_account_name").value.trim());
    fd.append("amount", document.getElementById("amount").value);
    fd.append("notes", document.getElementById("notes").value);
    fd.append("validity_days", document.getElementById("validity_days").value || "30");
    fd.append("consent_capable", "true");
    var f = document.getElementById("file").files[0];
    if (f) fd.append("file", f);

    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    try {
      var r = await fetch(API + "/api/public/quote/" + encodeURIComponent(token), { method: "POST", body: fd });
      var text = await r.text();
      var d = {};
      try { d = JSON.parse(text); } catch (_) { throw new Error(text.slice(0, 180) || "Server error"); }
      if (!r.ok) {
        var msg = d.detail || "Submit failed";
        if (Array.isArray(msg)) msg = msg.map(function (x) { return x.msg || JSON.stringify(x); }).join(", ");
        throw new Error(msg);
      }
      showMsg(d.message || "Submitted successfully. Await procurement acknowledgement.", "ok");
      btn.textContent = "Submitted";
      document.getElementById("vendor-form").style.opacity = "0.65";
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = "Submit quotation";
    }
  });


  function addQLine(desc, qty, unit, cost) {
    var tb = document.getElementById("quote-lines");
    if (!tb) return;
    var tr = document.createElement("tr");
    tr.innerHTML = '<td><input class="qd" value="'+(desc||'')+'" style="width:100%"/></td>'+
      '<td><input class="qq" type="number" step="0.01" value="'+(qty!=null?qty:1)+'" style="width:70px"/></td>'+
      '<td><input class="qu" value="'+(unit||'unit')+'" style="width:70px"/></td>'+
      '<td><input class="qc" type="number" step="0.01" value="'+(cost!=null?cost:0)+'" style="width:90px"/></td>'+
      '<td class="qa">0.00</td><td><button type="button" class="qx">×</button></td>';
    function recalc(){
      var q=parseFloat(tr.querySelector(".qq").value)||0, c=parseFloat(tr.querySelector(".qc").value)||0;
      tr.querySelector(".qa").textContent=(q*c).toFixed(2);
      var t=0; document.querySelectorAll("#quote-lines tr").forEach(function(r){ t+=parseFloat(r.querySelector(".qa").textContent)||0; });
      document.getElementById("amount").value=t.toFixed(2);
    }
    tr.querySelector(".qq").oninput=recalc; tr.querySelector(".qc").oninput=recalc;
    tr.querySelector(".qx").onclick=function(){ tr.remove(); recalc(); };
    tb.appendChild(tr); recalc();
  }
  document.getElementById("btn-add-qline")?.addEventListener("click", function(){ addQLine("",1,"unit",0); });

  // preload items as lines when RFQ items exist
  var _origLoad = load;
  load = async function(){
    await _origLoad();
    // if items loaded in table, seed quote lines once
  };

  // patch submit to include lines_json
  var form = document.getElementById("vendor-form");
  var oldSubmit = form.onsubmit;
  form.addEventListener("submit", function(e){
    // lines collected in main handler - enhance fetch by monkeypatching FormData append via override
  }, true);

  // Re-bind submit properly
  document.getElementById("vendor-form").onsubmit = null;
  document.getElementById("vendor-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!document.getElementById("consent").checked) { alert("Consent is required"); return; }
    var lines = [];
    document.querySelectorAll("#quote-lines tr").forEach(function(r){
      var d=r.querySelector(".qd")?.value||"";
      var q=parseFloat(r.querySelector(".qq")?.value)||0;
      var u=r.querySelector(".qu")?.value||"unit";
      var c=parseFloat(r.querySelector(".qc")?.value)||0;
      if(d) lines.push({description:d, quantity:q, unit:u, unit_cost:c, amount:q*c});
    });
    var fd = new FormData();
    fd.append("vendor_name", document.getElementById("vendor_name").value.trim());
    fd.append("vendor_email", document.getElementById("vendor_email").value.trim());
    fd.append("vendor_phone", document.getElementById("vendor_phone").value.trim());
    fd.append("cac_number", document.getElementById("cac_number").value.trim());
    fd.append("tax_clearance", document.getElementById("tax_clearance").value + (document.getElementById("tax_ref").value ? (" / "+document.getElementById("tax_ref").value) : ""));
    fd.append("qualification", document.getElementById("qualification").value + " | Experience: " + document.getElementById("experience").value + " | Reg. Govt: " + document.getElementById("reg_govt").value + " | 3yr Audit: " + document.getElementById("audit_3yrs").value + " | Address: " + document.getElementById("address").value);
    fd.append("bank_name", document.getElementById("bank_name").value.trim());
    fd.append("bank_account", document.getElementById("bank_account").value.trim());
    fd.append("bank_account_name", document.getElementById("bank_account_name").value.trim());
    fd.append("amount", document.getElementById("amount").value);
    fd.append("notes", document.getElementById("notes").value);
    fd.append("validity_days", document.getElementById("validity_days").value || "30");
    fd.append("consent_capable", "true");
    fd.append("lines_json", JSON.stringify(lines));
    var f = document.getElementById("file").files[0];
    if (f) fd.append("file", f);
    var btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Submitting…";
    try {
      var r = await fetch(API + "/api/public/quote/" + encodeURIComponent(token), { method: "POST", body: fd });
      var text = await r.text();
      var d = {};
      try { d = JSON.parse(text); } catch (_) { throw new Error(text.slice(0, 180) || "Server error"); }
      if (!r.ok) {
        var msg = d.detail || "Submit failed";
        if (Array.isArray(msg)) msg = msg.map(function(x){ return x.msg||JSON.stringify(x); }).join(", ");
        throw new Error(msg);
      }
      showMsg(d.message || "Submitted successfully.", "ok");
      btn.textContent = "Submitted";
      document.getElementById("vendor-form").style.opacity = "0.65";
    } catch (err) {
      alert(err.message);
      btn.disabled = false; btn.textContent = "Submit quotation";
    }
  });

  // seed one empty line
  setTimeout(function(){ if(document.getElementById("quote-lines") && !document.getElementById("quote-lines").children.length) addQLine("",1,"unit",0); }, 400);
  load();
})();
</script>
</body>
</html>
