<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Purchase Order Response</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8}.wrap{max-width:560px;margin:32px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:1.25rem}label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
.btn{padding:12px 18px;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.ok{background:#198754;color:#fff}.no{background:#dc3545;color:#fff}
</style></head><body><div class="wrap">
<h1>Purchase order response</h1>
<p id="msg"></p>
<div id="actions" style="display:none">
<label>Delivery / service completion %</label>
<input type="number" id="pct" min="0" max="100" value="0"/>
<label>Invoice (PDF)</label>
<input type="file" id="inv" accept=".pdf,image/*"/>
<button class="btn ok" id="accept">Accept offer &amp; submit invoice</button>
<button class="btn no" id="reject">Reject offer</button>
</div>
</div>
<script>
const token = location.pathname.split("/").filter(Boolean).pop();
async function load(){
  let r = await fetch("/api/public/po-result/"+token);
  if(!r.ok) r = await fetch("/api/public/result/"+token);
  const d = await r.json();
  document.getElementById("msg").textContent = d.message||"";
  document.getElementById("actions").style.display = d.can_respond ? "block" : "none";
}
load();
document.getElementById("accept").onclick = async ()=>{
  const fd = new FormData();
  fd.append("response","accepted");
  fd.append("delivery_percent", document.getElementById("pct").value||"0");
  const f = document.getElementById("inv").files[0];
  if(f) fd.append("invoice", f);
  const r = await fetch("/api/public/po-result/"+token,{method:"POST",body:fd});
  const d = await r.json();
  if(!r.ok) return alert(d.detail||"Failed");
  alert(d.message||"Accepted"); load();
};
document.getElementById("reject").onclick = async ()=>{
  const fd = new FormData(); fd.append("response","rejected");
  await fetch("/api/public/po-result/"+token,{method:"POST",body:fd}); load();
};
</script></body></html>
